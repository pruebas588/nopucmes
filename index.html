/* ============================================================

const SUPABASE_URL =
    'https://ldaskkqbcnoagpbrkpzb.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_v7mQA88eZYVFHxt7od2ICw_z3IuVRep';

const USER_ACCOUNTS = {
    Noe: 'noe@ourdates.app',
    Dani: 'dani@ourdates.app'
};

const WHATSAPP_NUMBERS = {
    Dani: '34622173077',
    Noe: '34601455616'
};


/* ============================================================
   SUPABASE
   ============================================================ */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
            }
        }
    );


/* ============================================================
   ESTADO
   ============================================================ */

const EMOJIS = {
    Comer: '🍽️',
    Cine: '🎬',
    Paseo: '🚶',
    Compras: '🛍️'
};

let currentUser = null;
let currentAuthUser = null;
let selectedLoginUser = null;
let allProposals = [];
let realtimeChannel = null;


/* ============================================================
   FORZAR SCROLL ARRIBA
   ============================================================ */

function forceScrollToTop() {

    document.documentElement.style.scrollBehavior = 'auto';
    document.body.style.scrollBehavior = 'auto';

    window.scrollTo(0, 0);

    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

    requestAnimationFrame(() => {

        window.scrollTo(0, 0);

        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

    });

    setTimeout(() => {

        window.scrollTo(0, 0);

        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

    }, 50);

    setTimeout(() => {

        window.scrollTo(0, 0);

        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

    }, 300);

    setTimeout(() => {

        window.scrollTo(0, 0);

        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

    }, 800);
}


/* ============================================================
   ELEGIR USUARIO
   ============================================================ */

function selectUser(user) {

    selectedLoginUser = user;

    /*
     * Guardamos que estamos en la parte superior
     * antes de abrir el teclado.
     */
    window.scrollTo(0, 0);

    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

    document.getElementById('welcomeModal')
        .classList.add('hidden-welcome');

    document.getElementById('pinModal')
        .classList.remove('hidden');

    document.getElementById('pinTitle')
        .textContent =
            user === 'Noe'
                ? 'Hola Noe 💕'
                : 'Hola Dani 💙';

    document.getElementById('pinEmoji')
        .textContent =
            user === 'Noe'
                ? '💕'
                : '💙';

    document.getElementById('pinInput')
        .value = '';

    document.getElementById('pinError')
        .textContent = '';

    applyTheme(user);

    /*
     * Damos tiempo a Safari para colocar el modal.
     *
     * preventScroll evita que Safari desplace
     * automáticamente la página al enfocar el input.
     */
    setTimeout(() => {

        const input =
            document.getElementById('pinInput');

        input.focus({
            preventScroll: true
        });

    }, 100);
}


function backToUserSelection() {

    selectedLoginUser = null;

    const input =
        document.getElementById('pinInput');

    input.blur();

    document.getElementById('pinModal')
        .classList.add('hidden');

    document.getElementById('welcomeModal')
        .classList.remove('hidden-welcome');

    input.value = '';

    document.getElementById('pinError')
        .textContent = '';

    document.body.classList.remove(
        'theme-dani'
    );

    forceScrollToTop();
}


/* ============================================================
   LOGIN CON PIN
   ============================================================ */

async function loginWithPin() {

    if (!selectedLoginUser) return;

    const pinInput =
        document.getElementById('pinInput');

    const errorElement =
        document.getElementById('pinError');

    const pin =
        pinInput.value.trim();

    const email =
        USER_ACCOUNTS[selectedLoginUser];


    if (
        !email ||
        email.startsWith('TU_')
    ) {

        errorElement.textContent =
            'Primero configura el email de este usuario en el código.';

        return;
    }


    if (!pin) {

        errorElement.textContent =
            'Introduce tu PIN.';

        return;
    }


    if (!/^\d{4,9}$/.test(pin)) {

        errorElement.textContent =
            'El PIN debe tener entre 4 y 9 dígitos.';

        return;
    }


    errorElement.textContent =
        'Entrando...';


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password: pin
        });


    if (error) {

        console.error(error);

        errorElement.textContent =
            'PIN incorrecto. Inténtalo de nuevo.';

        pinInput.value = '';

        pinInput.focus({
            preventScroll: true
        });

        return;
    }


    currentAuthUser =
        data.user;

    currentUser =
        selectedLoginUser;

    await OneSignal.login(currentUser);


    /*
     * Cerramos el modal y el teclado.
     */

    pinInput.blur();

    document.getElementById('pinModal')
        .classList.add('hidden');


    document.getElementById('userName')
        .textContent =
            currentUser;


    applyTheme(currentUser);


    /*
     * IMPORTANTE:
     * Safari puede restaurar la posición después
     * de cerrar el teclado.
     */

    forceScrollToTop();


    await loadProposals();

    setupRealtime();


    /*
     * Volvemos a comprobar la posición después
     * de cargar las propuestas.
     */

    forceScrollToTop();
}


/* ============================================================
   INICIALIZAR
   ============================================================ */

async function initializeApp() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        document.getElementById('welcomeModal')
            .classList.remove('hidden-welcome');

        return;
    }


    currentAuthUser =
        session.user;


    const email =
        (session.user.email || '')
            .toLowerCase();


    if (
        email ===
        USER_ACCOUNTS.Noe.toLowerCase()
    ) {

        currentUser = 'Noe';

    } else if (
        email ===
        USER_ACCOUNTS.Dani.toLowerCase()
    ) {

        currentUser = 'Dani';

    } else {

        await supabaseClient.auth.signOut();

        document.getElementById('welcomeModal')
            .classList.remove('hidden-welcome');

        return;
    }


    document.getElementById('welcomeModal')
        .classList.add('hidden-welcome');

    document.getElementById('pinModal')
        .classList.add('hidden');


    document.getElementById('userName')
        .textContent =
            currentUser;


    applyTheme(currentUser);


    await loadProposals();

    setupRealtime();
}


/* ============================================================
   CERRAR SESIÓN
   ============================================================ */

async function logout() {

    if (realtimeChannel) {

        await supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;
    }


    await supabaseClient.auth.signOut();


    currentUser = null;

    currentAuthUser = null;

    allProposals = [];


    document.getElementById('userName')
        .textContent =
            'Usuario';


    document.getElementById('welcomeModal')
        .classList.remove('hidden-welcome');


    document.getElementById('pinModal')
        .classList.add('hidden');


    document.body.classList.remove(
        'theme-dani'
    );


    forceScrollToTop();
}


/* ============================================================
   TEMA
   ============================================================ */

function applyTheme(user) {

    if (user === 'Dani') {

        document.body.classList.add(
            'theme-dani'
        );

    } else {

        document.body.classList.remove(
            'theme-dani'
        );
    }
}


/* ============================================================
   CARGAR PROPUESTAS
   ============================================================ */

async function loadProposals() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from('proposals')
            .select('*')
            .order('created_at', {
                ascending: false
            });


    if (error) {

        console.error(
            'Error cargando propuestas:',
            error
        );

        alert(
            'No se han podido cargar las propuestas. Revisa Supabase.'
        );

        return;
    }


    allProposals =
        data.map(p => ({

            id: p.id,

            from: p.from_user,

            for: p.for_user,

            type: p.type,

            budget: p.budget,

            date: p.date,

            time: p.time,

            description: p.description,

            status: p.status,

            created_at: p.created_at

        }));


    renderProposals();
}


/* ============================================================
   REALTIME
   ============================================================ */

function setupRealtime() {

    if (realtimeChannel) return;


    realtimeChannel =
        supabaseClient
            .channel(
                'our-dates-proposals'
            )
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'proposals'
                },
                async () => {

                    await loadProposals();

                }
            )
            .subscribe(
                status => {

                    console.log(
                        'Our Dates Realtime:',
                        status
                    );

                }
            );
}


/* ============================================================
   TABS
   ============================================================ */

function switchTab(
    tab,
    button
) {

    document.querySelectorAll(
        '.section'
    ).forEach(
        s =>
            s.classList.remove(
                'active'
            )
    );


    document.querySelectorAll(
        '.tab-btn'
    ).forEach(
        b =>
            b.classList.remove(
                'active'
            )
    );


    document.getElementById(tab)
        .classList.add('active');


    button.classList.add('active');


    renderProposals();
}


/* ============================================================
   MODAL
   ============================================================ */

function openNewModal() {

    document.getElementById('newModal')
        .classList.add('active');

    setupPlanSelection();
}


function closeModal() {

    document.getElementById('newModal')
        .classList.remove('active');
}


function setupPlanSelection() {

    document
        .querySelectorAll(
            '.option-btn[data-plan]'
        )
        .forEach(btn => {

            btn.onclick = e => {

                e.preventDefault();


                document
                    .querySelectorAll(
                        '.option-btn[data-plan]'
                    )
                    .forEach(
                        b =>
                            b.classList.remove(
                                'selected'
                            )
                    );


                btn.classList.add(
                    'selected'
                );


                document.getElementById(
                    'planType'
                ).value =
                    btn.dataset.plan;

            };

        });


    document
        .querySelectorAll(
            '.option-btn[data-budget]'
        )
        .forEach(btn => {

            btn.onclick = e => {

                e.preventDefault();


                document
                    .querySelectorAll(
                        '.option-btn[data-budget]'
                    )
                    .forEach(
                        b =>
                            b.classList.remove(
                                'selected'
                            )
                    );


                btn.classList.add(
                    'selected'
                );


                document.getElementById(
                    'budget'
                ).value =
                    btn.dataset.budget;

            };

        });
}


/* ============================================================
   CREAR PROPUESTA
   ============================================================ */

document
    .getElementById('proposalForm')
    .onsubmit =
    async e => {

        e.preventDefault();


        if (
            !currentAuthUser ||
            !currentUser
        ) {

            alert(
                'Primero tienes que iniciar sesión.'
            );

            return;
        }


        const proposal = {

            user_id:
                currentAuthUser.id,

            from_user:
                currentUser,

            for_user:
                document.getElementById(
                    'forWho'
                ).value,

            type:
                document.getElementById(
                    'planType'
                ).value,

            budget:
                document.getElementById(
                    'budget'
                ).value,

            date:
                document.getElementById(
                    'date'
                ).value,

            time:
                document.getElementById(
                    'time'
                ).value,

            description:
                document.getElementById(
                    'description'
                ).value,

            status:
                'pending'
        };


        if (
            !proposal.for_user ||
            !proposal.type ||
            !proposal.budget ||
            !proposal.date ||
            !proposal.time
        ) {

            alert(
                'Completa todos los campos obligatorios.'
            );

            return;
        }


        const {
            error
        } =
            await supabaseClient
                .from('proposals')
                .insert(proposal);


        if (error) {

            console.error(
                'Error creando propuesta:',
                error
            );

            alert(
                'No se ha podido enviar la propuesta: ' +
                error.message
            );

            return;
        }


        closeModal();


        document.getElementById(
            'proposalForm'
        ).reset();


        document
            .querySelectorAll(
                '.option-btn'
            )
            .forEach(
                b =>
                    b.classList.remove(
                        'selected'
                    )
            );


        await loadProposals();


        setTimeout(() => {

            alert(
                '¡Propuesta enviada! 💕'
            );

        }, 200);

    };


/* ============================================================
   ACEPTAR / RECHAZAR
   ============================================================ */

async function acceptProposal(id) {

    const {
        error
    } =
        await supabaseClient
            .from('proposals')
            .update({
                status: 'accepted'
            })
            .eq(
                'id',
                id
            );


    if (error) {

        console.error(error);

        alert(
            'No se ha podido confirmar la cita.'
        );

        return;
    }


    await loadProposals();


    alert(
        '¡Cita confirmada! 🎉'
    );
}


async function rejectProposal(id) {

    const {
        error
    } =
        await supabaseClient
            .from('proposals')
            .update({
                status: 'rejected'
            })
            .eq(
                'id',
                id
            );


    if (error) {

        console.error(error);

        alert(
            'No se ha podido rechazar la propuesta.'
        );

        return;
    }


    await loadProposals();
}


/* ============================================================
   WHATSAPP
   ============================================================ */

function getOtherUser(user) {

    return user === 'Noe'
        ? 'Dani'
        : 'Noe';
}


function sendToWhatsApp(proposal) {

    const other =
        getOtherUser(currentUser);


    const phone =
        WHATSAPP_NUMBERS[other];


    if (!phone) {

        alert(
            'Todavía no has configurado el WhatsApp.'
        );

        return;
    }


    const message =
        '¡Tengo una propuesta para ti! 💕 Entra en Our Dates para verla: https://pruebas588.github.io/dates/';


    const url =
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;


    window.open(
        url,
        '_blank'
    );
}


/* ============================================================
   FECHAS
   ============================================================ */

function formatDate(dateStr) {

    const date =
        new Date(
            dateStr + 'T00:00:00'
        );


    return date.toLocaleDateString(
        'es-ES',
        {
            weekday: 'short',
            month: 'short',
            day: 'numeric'
        }
    );
}


/* ============================================================
   RENDER
   ============================================================ */

function renderProposals() {

    if (!currentUser) return;


    const requestsContainer =
        document.getElementById(
            'requestsContainer'
        );


    const proposalsContainer =
        document.getElementById(
            'proposalsContainer'
        );


    const confirmedContainer =
        document.getElementById(
            'confirmedContainer'
        );


    const myRequests =
        allProposals.filter(
            p =>
                p.for === currentUser &&
                p.status === 'pending'
        );


    const myProposals =
        allProposals.filter(
            p =>
                p.from === currentUser
        );


    const confirmed =
        allProposals.filter(
            p =>
                p.status === 'accepted'
        );


    /* PETICIONES */

        myRequests.length === 0
    ) {

        requestsContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-emoji">
                    📭
                </div>

                <p>
                    No hay peticiones aún
                </p>

            </div>

        `;

    } else {

        requestsContainer.innerHTML =
            myRequests
                .map(
                    p => `

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        ${p.from} propone...
                    </div>

                </div>


                <div class="card-details">

                    <div>
                        ${EMOJIS[p.type]}
                        <strong>
                            ${p.type}
                        </strong>
                    </div>

                    <div>
                        💰
                        <strong>
                            ${p.budget}
                        </strong>
                    </div>

                    <div>
                        📅
                        <strong>
                            ${formatDate(p.date)}
                        </strong>
                    </div>

                    <div>
                        ⏰
                        <strong>
                            ${p.time}
                        </strong>
                    </div>

                    ${
                        p.description
                            ? `
                                <div>
                                    📝
                                    ${p.description}
                                </div>
                            `
                            : ''
                    }

                </div>


                <div class="card-actions">

                    <button
                        class="btn-small btn-accept"

                    >
                        ✅ Aceptar
                    </button>

                    <button
                        class="btn-small btn-reject"
                        onclick="rejectProposal(${p.id})"
                    >
                        ❌ Rechazar
                    </button>

                </div>

            </div>

        `
                )
                .join('');

    }


    /* MIS PROPUESTAS */

    if (
        myProposals.length === 0
    ) {

        proposalsContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-emoji">
                    ✈️
                </div>

                <p>
                    No has propuesto nada aún
                </p>

            </div>

        `;

    } else {

        proposalsContainer.innerHTML =
            myProposals
                .map(
                    p => `

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        Para ${p.for}
                    </div>

                    <span
                        class="status-badge status-${p.status}"
                    >

                        ${
                            p.status === 'pending'
                                ? '⏳'

                                    ? '✅'
                                    : '❌'
                        }

                    </span>

                </div>


                <div class="card-details">

                    <div>
                        ${EMOJIS[p.type]}

                        <strong>
                            ${p.type}
                        </strong>
                    </div>

                    <div>
                        💰

                        <strong>
                            ${p.budget}
                        </strong>
                    </div>

                    <div>
                        📅

                        <strong>
                            ${formatDate(p.date)}
                        </strong>
                    </div>

                    <div>
                        ⏰

                        <strong>
                            ${p.time}
                        </strong>
                    </div>

                    ${
                        p.description
                            ? `
                                <div>
                                    📝
                                    ${p.description}
                                </div>
                            `
                            : ''
                    }

                </div>


                ${
                    p.status === 'pending'
                        ? `
                            <div class="card-actions">

                                <button

    if (
        confirmed.length === 0

        confirmedContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-emoji">
                    📅
                </div>

                <p>

                </p>

    } else {

        confirmedContainer.innerHTML =
            confirmed

                    p => `

            <div class="card">
