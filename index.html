<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary-color: #ec4899;
        --primary-light: #f472b6;
        --bg-gradient: linear-gradient(
            135deg,
            #fce7f3 0%,
            #fef3c7 50%,
            #fce7f3 100%
        );
        --accent-color: #be123c;
    }

    body.theme-dani {
        --primary-color: #3b82f6;
        --primary-light: #60a5fa;
        --bg-gradient: linear-gradient(
            135deg,
            #dbeafe 0%,
            #e0e7ff 50%,
            #dbeafe 100%
        );
        --accent-color: #1e40af;
    }

    html {
        scroll-behavior: auto;
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            'Roboto',
            sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        padding: 16px;
        overflow-x: hidden;
    }

    .container {
        max-width: 480px;
        margin: 0 auto;
    }

    .header {
        background: white;
        padding: 20px;
        border-radius: 16px;
        margin-bottom: 20px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0,0,0,.1);
    }

    .header h1 {
        color: var(--accent-color);
        font-size: 28px;
        margin-bottom: 8px;
    }

    .user-info {
        color: #666;
        font-size: 14px;
    }

    .user-info strong {
        color: var(--accent-color);
        font-size: 16px;
    }

    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        background: white;
        padding: 8px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,.1);
    }

    .tab-btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        background: #f3f4f6;
        color: #666;
    }

    .tab-btn.active {
        background:
            linear-gradient(
                90deg,
                var(--primary-color),
                var(--primary-light)
            );
        color: white;
    }

    .section {
        display: none;
    }

    .section.active {
        display: block;
    }

    .card {
        background: white;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,.1);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .card-title {
        font-size: 16px;
        font-weight: 700;
        color: #1f2937;
    }

    .card-details {
        font-size: 13px;
        color: #666;
        line-height: 1.6;
    }

    .card-details div {
        margin-bottom: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .card-details strong {
        color: #1f2937;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        font-weight: 600;
    }

    .status-pending {
        background: #fef3c7;
        color: #92400e;
    }

    .status-accepted {
        background: #dcfce7;
        color: #15803d;
    }

    .status-rejected {
        background: #fee2e2;
        color: #991b1b;
    }

    .status-cancelled {
        background: #e5e7eb;
        color: #4b5563;
    }

    .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
    }

    .btn-small {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-accept {
        background: #d1fae5;
        color: #065f46;
    }

    .btn-reject {
        background: #fee2e2;
        color: #991b1b;
    }

    .btn-whatsapp {
        background: #25d366;
        color: white;
    }

    .btn-cancel {
        background: #f3f4f6;
        color: #4b5563;
    }

    .btn-new {
        width: 100%;
        padding: 16px;
        background:
            linear-gradient(
                90deg,
                var(--primary-color),
                var(--primary-light)
            );
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 20px;
    }

    .empty-state {
        text-align: center;
        padding: 32px 16px;
        color: #999;
    }

    .empty-state-emoji {
        font-size: 48px;
        margin-bottom: 12px;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.5);
        z-index: 1000;
        padding: 16px;
        overflow-y: auto;
    }

    .modal.active {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background: white;
        border-radius: 24px;
        padding: 24px;
        width: 100%;
        max-width: 460px;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--accent-color);
    }

    .btn-close {
        background: #f3f4f6;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 8px;
    }

    .form-input,
    .form-select,
    .form-textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
        outline: none;
        border-color: var(--primary-color);
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .option-btn {
        padding: 12px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
    }

    .option-btn.selected {
        border-color: var(--primary-color);
        background: rgba(0,0,0,.04);
        color: var(--accent-color);
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        background:
            linear-gradient(
                90deg,
                var(--primary-color),
                var(--primary-light)
            );
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 16px;
    }

    /* DÍA + HORA EN LA MISMA LÍNEA */
    .datetime-row {
        display: flex;
        gap: 12px;
        width: 100%;
    }

    .datetime-row .form-group {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .datetime-row .form-input,
    .datetime-row .form-select {
        width: 100%;
        box-sizing: border-box;
    }

    .welcome-modal,
    .pin-modal {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        background:
            linear-gradient(
                135deg,
                #fce7f3 0%,
                #fef3c7 50%,
                #fce7f3 100%
            );
    }

    .pin-modal {
        z-index: 2500;
    }

    .hidden-welcome,
    .pin-modal.hidden {
        display: none;
    }

    .welcome-content,
    .pin-content {
        background: white;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 25px rgba(0,0,0,.1);
    }

    .welcome-emoji,
    .pin-emoji {
        font-size: 64px;
        margin-bottom: 16px;
    }

    .pin-emoji {
        font-size: 56px;
        margin-bottom: 12px;
    }

    .welcome-title,
    .pin-title {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent-color);
        margin-bottom: 8px;
    }

    .welcome-subtitle,
    .pin-subtitle {
        font-size: 14px;
        color: #666;
        margin-bottom: 24px;
    }

    .welcome-buttons {
        display: flex;
        gap: 12px;
    }

    .btn-user {
        flex: 1;
        padding: 16px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
    }

    .btn-user.noe {
        background:
            linear-gradient(
                135deg,
                #ec4899,
                #f472b6
            );
        color: white;
    }

    .btn-user.dani {
        background:
            linear-gradient(
                135deg,
                #3b82f6,
                #60a5fa
            );
        color: white;
    }

    .pin-subtitle {
        margin-bottom: 20px;
    }

    .pin-input {
        width: 100%;
        padding: 15px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 24px;
        text-align: center;
        letter-spacing: 8px;
        font-weight: 700;
        outline: none;
    }

    .pin-input:focus {
        border-color: var(--primary-color);
    }

    .pin-error {
        color: #dc2626;
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
    }

    .pin-button {
        width: 100%;
        padding: 14px;
        margin-top: 16px;
        border: none;
        border-radius: 12px;
        background:
            linear-gradient(
                90deg,
                var(--primary-color),
                var(--primary-light)
            );
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
    }

    .pin-back {
        margin-top: 12px;
        background: none;
        border: none;
        color: #777;
        cursor: pointer;
        font-size: 13px;
    }

    .logout {
        display: block;
        margin: 8px auto 0;
        background: none;
        border: none;
        color: #999;
        font-size: 12px;
        cursor: pointer;
    }

    @media (max-width: 600px) {

        .pin-modal {
            height: 100dvh;
            min-height: 100dvh;
            overflow: hidden;
        }

        .pin-content {
            transform: translateZ(0);
        }

        .datetime-row {
            flex-direction: row;
        }
    }
</style>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

</head>

<body>

<!-- ELEGIR PERSONA -->

<div id="welcomeModal" class="welcome-modal">

    <div class="welcome-content">

        <div class="welcome-emoji">
            💕
        </div>

        <div class="welcome-title">
            Our Dates
        </div>

        <div class="welcome-subtitle">
            ¿Quién eres?
        </div>

        <div class="welcome-buttons">

            <button
                class="btn-user noe"
                onclick="selectUser('Noe')"
            >
                Soy Noe 💕
            </button>

            <button
                class="btn-user dani"
                onclick="selectUser('Dani')"
            >
                Soy Dani 💙
            </button>

        </div>

    </div>

</div>


<!-- PIN -->

<div id="pinModal" class="pin-modal hidden">

    <div class="pin-content">

        <div
            class="pin-emoji"
            id="pinEmoji"
        >
            💕
        </div>

        <div
            class="pin-title"
            id="pinTitle"
        >
            Hola 💕
        </div>

        <div class="pin-subtitle">
            Introduce tu PIN para entrar
        </div>

        <input
            type="password"
            id="pinInput"
            class="pin-input"
            inputmode="numeric"
            maxlength="9"
            autocomplete="current-password"
            placeholder="•••••••••"
        >

        <div
            id="pinError"
            class="pin-error"
        ></div>

        <button
            class="pin-button"
            onclick="loginWithPin()"
        >
            Entrar 💕
        </button>

        <button
            class="pin-back"
            onclick="backToUserSelection()"
        >
            ← Cambiar de persona
        </button>

    </div>

</div>


<div class="container">

    <div class="header">

        <h1>
            💕 Our Dates
        </h1>

        <div class="user-info">

            Hola
            <strong id="userName">
                Usuario
            </strong>

            <button
                class="logout"
                onclick="logout()"
            >
                Cerrar sesión
            </button>

        </div>

    </div>


    <div class="tabs">

        <button
            class="tab-btn active"
            onclick="switchTab('requests', this)"
        >
            Peticiones 📬
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('proposals', this)"
        >
            Mis propuestas ✈️
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('confirmed', this)"
        >
            Confirmadas 📅
        </button>

    </div>


    <div
        id="requests"
        class="section active"
    >

        <button
            class="btn-new"
            onclick="openNewModal()"
        >
            + Proponer cita 💌
        </button>

        <div id="requestsContainer"></div>

    </div>


    <div
        id="proposals"
        class="section"
    >

        <button
            class="btn-new"
            onclick="openNewModal()"
        >
            + Proponer cita 💌
        </button>

        <div id="proposalsContainer"></div>

    </div>


    <div
        id="confirmed"
        class="section"
    >

        <div id="confirmedContainer"></div>

    </div>

</div>


<!-- MODAL NUEVA PROPUESTA -->

<div
    id="newModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <div class="modal-title">
                Proponer cita 💕
            </div>

            <button
                class="btn-close"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>


        <form id="proposalForm">

            <div class="form-group">

                <label class="form-label">
                    ¿Qué vamos a hacer?
                </label>

                <div class="options-grid">

                    <button
                        type="button"
                        class="option-btn"
                        data-plan="Comer"
                    >
                        🍽️ Comer
                    </button>

                    <button
                        type="button"
                        class="option-btn"
                        data-plan="Cine"
                    >
                        🎬 Cine
                    </button>

                    <button
                        type="button"
                        class="option-btn"
                        data-plan="Paseo"
                    >
                        🚶 Paseo
                    </button>

                    <button
                        type="button"
                        class="option-btn"
                        data-plan="Compras"
                    >
                        🛍️ Compras
                    </button>

                </div>

                <input
                    type="hidden"
                    id="planType"
                >

            </div>


            <div class="form-group">

                <label class="form-label">
                    Presupuesto por persona
                </label>

                <div class="options-grid">

                    <button
                        type="button"
                        class="option-btn"
                        data-budget="5-10€"
                    >
                        💵 5-10€
                    </button>

                    <button
                        type="button"
                        class="option-btn"
                        data-budget="10-20€"
                    >
                        💳 10-20€
                    </button>

                    <button
                        type="button"
                        class="option-btn"
                        data-budget="20-40€"
                    >
                        💰 20-40€
                    </button>

                    <button
                        type="button"
                        class="option-btn"
                        data-budget="50€+"
                    >
                        💎 50€+
                    </button>

                </div>

                <input
                    type="hidden"
                    id="budget"
                >

            </div>


            <!-- DÍA + HORA -->

            <div class="datetime-row">

                <div class="form-group">

                    <label class="form-label">
                        📅 Día
                    </label>

                    <input
                        type="date"
                        class="form-input"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        ⏰ Hora
                    </label>

                    <select
                        class="form-select"
                        id="time"
                        required
                    >

                        <option value="">
                            Selecciona...
                        </option>

                        <option value="Mañana (10:00)">
                            10:00
                        </option>

                        <option value="Mediodía (13:00)">
                            13:00
                        </option>

                        <option value="Tarde (17:00)">
                            17:00
                        </option>

                        <option value="Atardecer (19:00)">
                            19:00
                        </option>

                        <option value="Noche (21:00)">
                            21:00
                        </option>

                        <option value="Flexible">
                            Flexible
                        </option>

                    </select>

                </div>

            </div>


            <!-- UBICACIÓN -->

            <div class="form-group">

                <label class="form-label">
                    📍 ¿Dónde?
                </label>

                <input
                    type="text"
                    class="form-input"
                    id="location"
                    placeholder="Casa Dani, restaurante, cine..."
                    autocomplete="off"
                >

            </div>


            <div class="form-group">

                <label class="form-label">
                    Descripción (opcional)
                </label>

                <textarea
                    class="form-textarea"
                    id="description"
                    placeholder="Ej: Sushi + paseo romántico..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn-submit"
            >
                Enviar propuesta 💌
            </button>

        </form>

    </div>

</div>

/* ============================================================
   AGREGAR A CALENDARIO DE APPLE
   ============================================================ */

function addToCalendar(id) {

    const proposal = allProposals.find(p => p.id === id);

    if (!proposal) return;

    // Convertir la fecha del formato "YYYY-MM-DD" a iCal format "YYYYMMDD"
    const dateStr = proposal.date.replace(/-/g, '');
    
    // Extraer la hora del formato "Mañana (10:00)" o similar
    let hour = '10'; // por defecto
    const timeMatch = proposal.time.match(/\d{2}:\d{2}/);
    if (timeMatch) {
        hour = timeMatch[0].replace(':', '');
    }

    const startTime = dateStr + 'T' + hour + '0000';
    const endTime = dateStr + 'T' + String(parseInt(hour.substring(0,2)) + 1).padStart(2, '0') + '0000';

    // Crear el contenido iCal
    const otherUser = proposal.from === currentUser ? proposal.for : proposal.from;
    const title = `${EMOJIS[proposal.type] || '💕'} ${proposal.type} con ${otherUser}`;
    const description = proposal.description 
        ? `${proposal.type}\nPresupuesto: ${proposal.budget}\n${proposal.description}`
        : `${proposal.type}\nPresupuesto: ${proposal.budget}`;
    const location = proposal.location || '';

    const icalContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Our Dates//EN
BEGIN:VEVENT
UID:ourdates-${proposal.id}@ourdates.app
DTSTAMP:${new Date().toISOString().replace(/[:-]/g, '').split('.')[0]}Z
DTSTART:${startTime}
DTEND:${endTime}
SUMMARY:${title}
DESCRIPTION:${description}
LOCATION:${location}
SEQUENCE:0
STATUS:CONFIRMED
END:VEVENT
END:VCALENDAR`;

    // Crear un blob y descargar
    const blob = new Blob([icalContent], { type: 'text/calendar;charset=utf-8' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    
    link.setAttribute('href', url);
    link.setAttribute('download', `cita-${proposal.id}.ics`);
    link.style.visibility = 'hidden';
    
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    alert('📅 Archivo de calendario descargado. Abre el archivo con Apple Calendar para importarlo.');
}

function renderProposals() {

    if (!currentUser) return;


    const requestsContainer =
        document.getElementById(
            'requestsContainer'
        );


    const proposalsContainer =
        document.getElementById(
            'proposalsContainer'
        );


    const confirmedContainer =
        document.getElementById(
            'confirmedContainer'
        );


    const myRequests =
        allProposals.filter(
            p =>
                p.for === currentUser &&
                p.status === 'pending'
        );


    const myProposals =
    allProposals.filter(
        p =>
            p.from === currentUser &&
            p.status !== 'cancelled'
    );


    const confirmed =
        allProposals.filter(
            p =>
                p.status === 'accepted'
        );


    /* ========================================================
       PETICIONES
       ======================================================== */

    if (
        myRequests.length === 0
    ) {

        requestsContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-emoji">
                    📭
                </div>

                <p>
                    No hay peticiones aún
                </p>

            </div>

        `;

    } else {

        requestsContainer.innerHTML =
            myRequests
                .map(
                    p => `

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        ${p.from} propone...
                    </div>

                </div>


                <div class="card-details">

                    <div>
                        ${EMOJIS[p.type] || '💕'}

                        <strong>
                            ${p.type}
                        </strong>
                    </div>

                    <div>
                        💰

                        <strong>
                            ${p.budget}
                        </strong>
                    </div>

                    <div>
                        📅

                        <strong>
                            ${formatDate(p.date)}
                        </strong>
                    </div>

                    <div>
                        ⏰

                        <strong>
                            ${p.time}
                        </strong>
                    </div>

                    ${
                        p.location
                            ? `
                                <div>
                                    📍
                                    <strong>
                                        ${p.location}
                                    </strong>
                                </div>
                            `
                            : ''
                    }

                    ${
                        p.description
                            ? `
                                <div>
                                    📝
                                    ${p.description}
                                </div>
                            `
                            : ''
                    }

                </div>


                <div class="card-actions">

                    <button
                        class="btn-small btn-accept"
                        onclick="acceptProposal(${p.id})"
                    >
                        ✅ Aceptar
                    </button>

                    <button
                        class="btn-small btn-reject"
                        onclick="rejectProposal(${p.id})"
                    >
                        ❌ Rechazar
                    </button>

                </div>

            </div>

        `
                )
                .join('');

    }


    /* ========================================================
       MIS PROPUESTAS
       ======================================================== */

    if (
        myProposals.length === 0
    ) {

        proposalsContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-emoji">
                    ✈️
                </div>

                <p>
                    No has propuesto nada aún
                </p>

            </div>

        `;

    } else {

        proposalsContainer.innerHTML =
            myProposals
                .map(
                    p => `

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        Para ${p.for}
                    </div>

                    <span
                        class="status-badge status-${p.status}"
                    >

                        ${getStatusEmoji(p.status)}

                    </span>

                </div>


                <div class="card-details">

                    <div>
                        ${EMOJIS[p.type] || '💕'}

                        <strong>
                            ${p.type}
                        </strong>
                    </div>

                    <div>
                        💰

                        <strong>
                            ${p.budget}
                        </strong>
                    </div>

                    <div>
                        📅

                        <strong>
                            ${formatDate(p.date)}
                        </strong>
                    </div>

                    <div>
                        ⏰

                        <strong>
                            ${p.time}
                        </strong>
                    </div>

                    ${
                        p.location
                            ? `
                                <div>
                                    📍

                                    <strong>
                                        ${p.location}
                                    </strong>
                                </div>
                            `
                            : ''
                    }

                    ${
                        p.description
                            ? `
                                <div>
                                    📝
                                    ${p.description}
                                </div>
                            `
                            : ''
                    }

                </div>


                ${
                    p.status === 'pending'
                        ? `
                            <div class="card-actions">

                                <button
                                    class="btn-small btn-whatsapp"
                                    onclick="sendToWhatsApp(${p.id})"
                                >
                                    💬 Recordar por WhatsApp
                                </button>

                                <button
                                    class="btn-small btn-cancel"
                                    onclick="cancelProposal(${p.id})"
                                >
                                    🚫 Cancelar
                                </button>

                            </div>
                        `
                        : p.status === 'accepted'
                            ? `
                                <div class="card-actions">

                                    <button
                                        class="btn-small btn-cancel"
                                        onclick="cancelProposal(${p.id})"
                                    >
                                        🚫 Cancelar plan
                                    </button>

                                </div>
                            `
                            : ''
                }

            </div>

        `
                )
                .join('');

    }


    /* ========================================================
       CONFIRMADAS
       ======================================================== */

    if (
        confirmed.length === 0
    ) {

        confirmedContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-emoji">
                    📅
                </div>

                <p>
                    No hay citas confirmadas aún
                </p>

            </div>

        `;

    } else {

        confirmedContainer.innerHTML =
            confirmed
                .map(
                    p => `

            <div class="card">

                <div class="card-header">

                    <div class="card-title">

                        Cita con ${
                            p.from === currentUser
                                ? p.for
                                : p.from
                        }

                    </div>

                </div>


                <div class="card-details">

                    <div>
                        ${EMOJIS[p.type] || '💕'}

                        <strong>
                            ${p.type}
                        </strong>
                    </div>

                    <div>
                        💰

                        <strong>
                            ${p.budget}
                        </strong>
                    </div>

                    <div>
                        📅

                        <strong>
                            ${formatDate(p.date)}
                        </strong>
                    </div>

                    <div>
                        ⏰

                        <strong>
                            ${p.time}
                        </strong>
                    </div>

                    ${
                        p.location
                            ? `
                                <div>
                                    📍

                                    <strong>
                                        ${p.location}
                                    </strong>
                                </div>
                            `
                            : ''
                    }

                    ${
                        p.description
                            ? `
                                <div>
                                    📝
                                    ${p.description}
                                </div>
                            `
                            : ''
                    }

                </div>


                ${
                    p.from === currentUser
                        ? `
                            <div class="card-actions">

                                <button
                                    class="btn-small"
                                    style="background: #e0e7ff; color: #3b82f6;"
                                    onclick="openEditModal(${p.id})"
                                >
                                    ✏️ Modificar
                                </button>

                                <button
                                    class="btn-small"
                                    style="background: #e8f8f5; color: #059669;"
                                    onclick="addToCalendar(${p.id})"
                                >
                                    📅 Calendario
                                </button>

                                <button
                                    class="btn-small btn-cancel"
                                    onclick="cancelProposal(${p.id})"
                                >
                                    🚫 Cancelar plan
                                </button>

                            </div>
                        `
                        : ''
                }

            </div>

        `
                )
                .join('');

    }
}


/* ============================================================
   ENTER EN EL PIN
   ============================================================ */

document
    .getElementById('pinInput')
    .addEventListener(
        'keydown',
        e => {

            if (e.key === 'Enter') {

                loginWithPin();

            }

        }
    );


/* ============================================================
   INICIAR
   ============================================================ */

initializeApp();

</script>

</body>
</html>
